<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>SimpleWork</title>
<style>
:root{
  --bg:#f6f7f9; --panel:#ffffff; --border:#e3e6ea; --text:#1f2328; --muted:#6b7280;
  --accent:#2563eb; --accent-soft:#eff4ff; --ok:#16a34a; --warn:#d97706; --err:#dc2626;
  --code-bg:#f3f4f6; --radius:10px; --rail:52px; --side:290px;
  --font:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif;
  --mono:ui-monospace,SFMono-Regular,Menlo,Consolas,"Courier New",monospace;
}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{background:var(--bg);color:var(--text);font-family:var(--font);font-size:14px;line-height:1.6;
  -webkit-font-smoothing:antialiased;overflow:hidden}
.app{display:flex;flex-direction:column;height:100%}
header{display:flex;align-items:center;gap:8px;padding:9px 14px;background:var(--panel);border-bottom:1px solid var(--border);flex:none}
.brand{font-weight:700;font-size:15px;letter-spacing:.2px}
.brand span{color:var(--accent)}
.badge{font-size:12px;color:var(--muted);background:var(--code-bg);padding:2px 8px;border-radius:20px;max-width:300px;
  overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.badge.desk{background:var(--accent-soft);color:var(--accent)}
.spacer{flex:1}
select,input[type=text],input[type=password],button,textarea{font-family:inherit;font-size:13px}
select{border:1px solid var(--border);border-radius:8px;padding:5px 8px;background:#fff;color:var(--text);max-width:220px}
button{border:1px solid var(--border);background:#fff;color:var(--text);border-radius:8px;padding:6px 12px;cursor:pointer;transition:background .12s}
button:hover{background:var(--code-bg)}
button.primary{background:var(--accent);border-color:var(--accent);color:#fff}
button.primary:hover{filter:brightness(1.05)}
button.ghost{background:transparent;border-color:transparent;color:var(--muted);padding:5px 8px}
button.ghost:hover{background:var(--code-bg);color:var(--text)}
main{flex:1;display:flex;min-height:0}

/* ---------- 最左侧图标栏（可折叠） ---------- */
.rail{width:var(--rail);flex:none;background:var(--panel);border-right:1px solid var(--border);
  display:flex;flex-direction:column;align-items:center;gap:5px;padding:8px 0}
.rail-btn{width:36px;height:36px;flex:none;border-radius:10px;display:flex;align-items:center;justify-content:center;
  cursor:pointer;color:var(--muted);font-size:16px;user-select:none;border:1px solid transparent}
.rail-btn:hover{background:var(--code-bg);color:var(--text)}
.rail-btn.active{background:var(--accent-soft);color:var(--accent);border-color:#dbe6ff}
.rail-btn.new{background:var(--accent);border-color:var(--accent);color:#fff;font-size:19px;line-height:1}
.rail-btn.new:hover{filter:brightness(1.08)}
.rail-sep{width:22px;height:1px;background:var(--border);margin:4px 0;flex:none}

/* ---------- 侧边功能面板 ---------- */
aside{width:var(--side);background:var(--panel);border-right:1px solid var(--border);overflow-y:auto;
  display:flex;flex-direction:column;flex:none}
body.collapsed aside{display:none}
.side-head{display:flex;align-items:center;gap:6px;padding:10px 12px 6px;flex:none;position:sticky;top:0;background:var(--panel);z-index:2}
.side-head b{font-size:13.5px}
.side-body{padding:0 12px 14px}
.pane{display:none}
.pane.active{display:block}
.item{border:1px solid var(--border);border-radius:var(--radius);padding:8px 10px;margin-bottom:8px;background:#fff}
.item .t{font-weight:600;font-size:13px;display:flex;align-items:center;gap:6px}
.item .d{color:var(--muted);font-size:12px;margin-top:2px;word-break:break-all}
.dot{width:8px;height:8px;border-radius:50%;background:var(--muted);flex:none}
.dot.ok{background:var(--ok)} .dot.err{background:var(--err)} .dot.off{background:#cbd5e1}
.switch{margin-left:auto;font-size:12px;color:var(--accent);cursor:pointer;font-weight:400}

/* ---------- 会话列表 ---------- */
.conv{border:1px solid var(--border);border-radius:10px;padding:7px 9px;margin-bottom:6px;background:#fff;
  cursor:pointer;position:relative}
.conv:hover{border-color:#c7d6f7;background:#fbfcff}
.conv.active{border-color:var(--accent);background:var(--accent-soft)}
.conv .t{font-size:12.8px;font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;padding-right:20px}
.conv .m{font-size:11px;color:var(--muted);margin-top:1px}
.conv .del{position:absolute;right:5px;top:4px;color:var(--muted);font-size:14px;line-height:1;
  padding:2px 5px;border-radius:6px;opacity:0;transition:opacity .12s}
.conv:hover .del{opacity:1}
.conv .del:hover{background:#fee2e2;color:var(--err)}

/* ---------- 对话区 ---------- */
.chat{flex:1;display:flex;flex-direction:column;min-width:0;min-height:0}
.messages{flex:1;overflow-y:auto;padding:22px 24px}
.msg{display:flex;justify-content:flex-start;width:100%;max-width:980px;margin:0 auto 18px}
.msg.me{justify-content:flex-end}
.row{display:flex;gap:10px;max-width:82%}
.msg.me .row{flex-direction:row-reverse}
.avatar{width:28px;height:28px;border-radius:8px;flex:none;display:flex;align-items:center;justify-content:center;font-size:12px;font-weight:700;color:#fff}
.avatar.me{background:#111827}
.avatar.ai{background:var(--accent)}
.bubble{background:var(--panel);border:1px solid var(--border);border-radius:var(--radius);padding:10px 14px;min-width:0;overflow-wrap:anywhere}
.msg.me .bubble{background:var(--accent);border-color:var(--accent);color:#fff}
.msg.me .bubble a{color:#e6efff}
.msg.me code{background:rgba(255,255,255,.22);color:#fff}
.msg.me pre.code{background:rgba(0,0,0,.18)}
.msg.me pre.code code{background:none}
.tool{border:1px dashed var(--border);border-radius:8px;margin:6px 0;background:#fcfcfd;position:relative}
.msg.me .tool{border-color:rgba(255,255,255,.5);background:rgba(255,255,255,.12)}
.tool summary{cursor:pointer;padding:6px 10px;font-size:12px;color:var(--muted);list-style:none}
.msg.me .tool summary{color:#eaf0ff}
.tool summary::-webkit-details-marker{display:none}
.tool pre{margin:0;padding:0 10px 10px;font-family:var(--mono);font-size:12px;color:var(--muted);white-space:pre-wrap;word-break:break-word;max-height:260px;overflow:auto}
.msg.me .tool pre{color:#f1f5ff}
pre.code{background:var(--code-bg);border-radius:8px;padding:10px 12px;overflow:auto;font-family:var(--mono);font-size:12.5px}
code{font-family:var(--mono);font-size:12.5px;background:var(--code-bg);padding:1px 4px;border-radius:4px}
pre.code code{background:none;padding:0}
.composer{border-top:1px solid var(--border);background:var(--panel);padding:12px 24px;flex:none}
.composer .box{max-width:980px;margin:0 auto;display:flex;gap:8px;align-items:flex-end}
textarea{flex:1;resize:none;border:1px solid var(--border);border-radius:10px;padding:10px 12px;min-height:44px;max-height:220px;outline:none;background:#fff;color:var(--text)}
textarea:focus{border-color:var(--accent);box-shadow:0 0 0 3px rgba(37,99,235,.08)}
.hint{font-size:11px;color:var(--muted);text-align:center;margin-top:6px}
.empty{color:var(--muted);text-align:center;margin-top:60px;padding:0 20px}
.empty h2{font-size:18px;margin:0 0 8px;color:var(--text)}
.empty .grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:10px;max-width:620px;margin:22px auto 0;text-align:left}
.card{border:1px solid var(--border);border-radius:10px;padding:10px 12px;background:#fff;color:var(--text);cursor:pointer}
.card:hover{border-color:#c7d6f7;background:#fbfcff}
.card b{display:block;font-size:13px;margin-bottom:2px}
.card span{font-size:12px;color:var(--muted)}
.search-row{display:flex;gap:6px;margin-bottom:8px}
.search-row input{flex:1;border:1px solid var(--border);border-radius:8px;padding:5px 8px;min-width:0}
.tag{font-size:11px;color:var(--muted);border:1px solid var(--border);border-radius:20px;padding:1px 6px}
.notice{max-width:980px;margin:10px auto 0;background:#fff8ec;border:1px solid #f6dfb6;color:#8a5a00;
  border-radius:10px;padding:8px 12px;font-size:12.5px;display:flex;align-items:center;gap:8px}
.notice button{padding:3px 10px;font-size:12px}
.keyrow{border:1px solid var(--border);border-radius:10px;padding:9px 10px;margin-bottom:8px;background:#fff}
.keyrow .hd{display:flex;align-items:center;gap:6px;font-size:13px;font-weight:600}
.keyrow .env{font-family:var(--mono);font-size:11px;color:var(--muted)}
.keyrow .r{display:flex;gap:6px;margin-top:6px}
.keyrow input{flex:1;border:1px solid var(--border);border-radius:7px;padding:5px 8px;min-width:0}
.sect{font-size:11.5px;color:var(--muted);margin:14px 0 6px;letter-spacing:.4px;text-transform:uppercase}
.pathbox{font-family:var(--mono);font-size:11.5px;color:var(--muted);word-break:break-all;background:var(--code-bg);
  border-radius:7px;padding:6px 8px;margin-bottom:6px}

/* ---------- 弹窗表单（自定义模型） ---------- */
.refbar{max-width:980px;margin:0 auto 8px;display:flex;flex-wrap:wrap;gap:6px;align-items:center}
.refbar:empty{display:none}
.refchip{display:inline-flex;align-items:center;gap:6px;max-width:420px;border:1px solid #c7d6f7;background:var(--accent-soft);
  color:var(--accent);border-radius:20px;padding:3px 6px 3px 10px;font-size:11.5px;cursor:pointer}
.refchip .x{border-radius:50%;width:16px;height:16px;line-height:14px;text-align:center;font-size:12px;
  background:rgba(37,99,235,.12)}
.refchip .x:hover{background:rgba(37,99,235,.28)}
.refchip span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.composer .box textarea{border-color:#d9e3fa}
.btn-ref{flex:none;white-space:nowrap;font-size:12.5px;padding:0 11px;height:44px;border-color:#c7d6f7;background:var(--accent-soft);color:var(--accent)}
.btn-ref:hover{background:#e2ebff}
.btn-ref.has{border-color:var(--accent)}

/* 引用卡片（消息内显示 / 跳转来源） */
.refcard{border-left:3px solid var(--accent);background:var(--accent-soft);border-radius:0 8px 8px 0;
  padding:6px 10px;margin:6px 0;font-size:12px;cursor:pointer;color:var(--text)}
.refcard:hover{background:#e4edff}
.msg.me .refcard{background:rgba(255,255,255,.16);border-left-color:#fff;color:#fff}
.msg.me .refcard:hover{background:rgba(255,255,255,.26)}
.refcard .rt{font-weight:600;font-size:11.5px;opacity:.85}
.refcard .rx{display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;color:var(--muted);margin-top:2px;white-space:pre-wrap}
.msg.me .refcard .rx{color:#e6efff}
.refcard.flash,.msg.flash>.row>.bubble{animation:flashHi 1.6s ease-out}
@keyframes flashHi{0%,30%{box-shadow:0 0 0 4px rgba(37,99,235,.42)}100%{box-shadow:0 0 0 0 rgba(37,99,235,0)}}

/* 引用选择器 */
.refpick{display:flex;gap:10px;min-height:320px}
.refpick .rp-left{width:190px;flex:none;border-right:1px solid var(--border);padding-right:8px;overflow:auto;max-height:420px}
.refpick .rp-right{flex:1;min-width:0;overflow:auto;max-height:420px}
.refpick .rp-item{border:1px solid var(--border);border-radius:8px;padding:6px 8px;margin-bottom:5px;cursor:pointer;font-size:12px;background:#fff}
.refpick .rp-item:hover{background:var(--code-bg)}
.refpick .rp-item.active{border-color:var(--accent);background:var(--accent-soft)}
.refpick .rp-item .t{font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.refpick .rp-item .m{color:var(--muted);font-size:11px}
.refpick .rp-msg{border:1px solid var(--border);border-radius:8px;padding:7px 9px;margin-bottom:7px;background:#fff;font-size:12px}
.refpick .rp-msg label{display:flex;gap:7px;align-items:flex-start;cursor:pointer}
.refpick .rp-msg input{margin-top:3px;flex:none}
.refpick .rp-msg .body{min-width:0}
.refpick .rp-msg .who{font-weight:600;font-size:11px;color:var(--muted)}
.refpick .rp-msg .txt{overflow:hidden;text-overflow:ellipsis;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;white-space:pre-wrap;word-break:break-word}
.refpick .rp-tool{margin:5px 0 0 20px;font-size:11.5px;color:var(--muted);display:flex;gap:6px;align-items:flex-start}
.refpick .rp-empty{color:var(--muted);font-size:12px;padding:20px 0;text-align:center}
.refpick .rp-head{display:flex;gap:6px;align-items:center;margin-bottom:8px}
.refpick .rp-head input{flex:1;min-width:0;border:1px solid var(--border);border-radius:8px;padding:5px 8px;font-size:12px}
.mask{position:fixed;inset:0;background:rgba(17,24,39,.42);z-index:60;display:flex;align-items:flex-start;
  justify-content:center;padding:38px 16px;overflow:auto}
.modal{background:var(--panel);border:1px solid var(--border);border-radius:14px;width:100%;max-width:540px;
  box-shadow:0 24px 60px rgba(15,23,42,.24);overflow:hidden}
.modal-head{display:flex;align-items:center;gap:8px;padding:11px 14px;border-bottom:1px solid var(--border)}
.modal-head b{font-size:14px}
.modal-body{padding:12px 14px 4px;max-height:calc(100vh - 220px);overflow:auto}
.modal-foot{display:flex;gap:8px;justify-content:flex-end;padding:11px 14px;border-top:1px solid var(--border);background:#fcfcfd}
.frow{margin-bottom:10px}
.frow label{display:block;font-size:12px;color:var(--muted);margin-bottom:3px}
.frow input,.frow select,.frow textarea{width:100%;border:1px solid var(--border);border-radius:8px;padding:6px 9px;
  background:#fff;color:var(--text);font-size:13px;outline:none}
.frow input:focus,.frow select:focus,.frow textarea:focus{border-color:var(--accent)}
.frow textarea{min-height:74px;resize:vertical;font-family:var(--mono);font-size:12px;line-height:1.6}
.frow .tip{font-size:11.5px;color:var(--muted);margin-top:3px;line-height:1.5}
.f2{display:flex;gap:8px}.f2>div{flex:1;min-width:0}
.chk{display:flex;align-items:center;gap:6px;font-size:12.5px;color:var(--text)}
.chk input{width:auto}
.item .acts{margin-left:auto;display:flex;gap:4px}
.item .acts button{padding:1px 7px;font-size:11.5px;border-radius:6px;line-height:1.6}
.ftest{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin:2px 0 10px}
.ftest .res{font-size:12px;color:var(--muted);word-break:break-all}

/* ---------- 搜索 ---------- */
.searchbar{display:none;align-items:center;gap:6px;padding:8px 24px;border-bottom:1px solid var(--border);
  background:var(--panel);flex:none}
.searchbar.on{display:flex}
.searchbar input{flex:1;max-width:560px;border:1px solid var(--border);border-radius:8px;padding:5px 9px;
  background:#fff;color:var(--text)}
.searchbar .cnt{font-size:12px;color:var(--muted);min-width:78px;text-align:center}
mark.hit{background:#fff2a8;color:inherit;border-radius:3px;padding:0 1px}
mark.hit.cur{background:#ffd23f;box-shadow:0 0 0 2px rgba(255,180,0,.35)}
.ghit{border:1px solid var(--border);border-radius:10px;padding:7px 9px;margin-bottom:6px;background:#fff;cursor:pointer}
.ghit:hover{border-color:#c7d6f7;background:#fbfcff}
.ghit .t{font-size:12.5px;font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.ghit .s{font-size:11.5px;color:var(--muted);margin-top:2px;line-height:1.5;max-height:54px;overflow:hidden}
.ghit .m{font-size:11px;color:var(--muted);margin-top:1px}
.ghit mark{background:#fff2a8;color:inherit}

/* ---------- 复制 ---------- */
.bubble{position:relative}
.copy{position:absolute;top:6px;right:8px;font-size:11px;color:var(--muted);background:rgba(255,255,255,.9);
  border:1px solid var(--border);border-radius:6px;padding:1px 7px;cursor:pointer;opacity:0;
  transition:opacity .12s;line-height:1.6;z-index:2}
.copies{position:absolute;top:6px;right:8px;display:flex;gap:4px;opacity:0;transition:opacity .12s;z-index:3}
.msg:hover .copies,.msg:hover .copy{opacity:1}
.copies .copy{position:static;opacity:1}
.msg.me .copy{color:#374151}
.copy:hover{background:var(--code-bg);color:var(--text)}
.copy.done{color:var(--ok);opacity:1}
.codewrap{position:relative}
.codewrap .copy{top:4px;right:4px}
.tool pre{position:relative}

/* ---------- 执行过程（默认收起，不主动展示） ---------- */
.steps{border:1px dashed var(--border);border-radius:8px;margin:8px 0 0;background:#fcfcfd}
.msg.me .steps{border-color:rgba(255,255,255,.5);background:rgba(255,255,255,.1)}
.steps>summary{cursor:pointer;padding:6px 10px;font-size:12px;color:var(--muted);list-style:none;user-select:none}
.steps>summary::-webkit-details-marker{display:none}
.steps>summary::before{content:'▸ ';font-size:10px}
.steps[open]>summary::before{content:'▾ '}
.steps[open]>summary{border-bottom:1px dashed var(--border)}
.msg.me .steps>summary{color:#eaf0ff}
.steps .tool{margin:6px 8px;border-style:solid}
.steps[open] .tool{margin:6px 8px}
</style>
</head>
<body>
<div class="app">
  <header>
    <div class="brand">Simple<span>Work</span></div>
    <div class="badge" id="cwd" title="工作区">-</div>
    <div class="badge desk" id="deskBadge" style="display:none">桌面版</div>
    <div class="spacer"></div>
    <button class="ghost" id="openCfgBtn" style="display:none">配置目录</button>
    <button class="ghost" id="searchBtn" title="在当前对话内搜索（Ctrl+F）">🔍</button>
    <select id="providerSel" title="选择模型供应商"></select>
    <select id="modelSel" title="选择模型"></select>
    <button id="clearBtn" title="清空当前对话的上下文">清空上下文</button>
    <button class="primary" id="newBtn">新对话</button>
  </header>
  <main>
    <nav class="rail">
      <div class="rail-btn new" id="railNew" title="新建对话">＋</div>
      <div class="rail-sep"></div>
      <div class="rail-btn active" data-pane="chat" title="历史对话">💬</div>
      <div class="rail-btn" data-pane="models" title="模型">◈</div>
      <div class="rail-btn" data-pane="mcp" title="MCP">⑃</div>
      <div class="rail-btn" data-pane="skills" title="Skills">❖</div>
      <div class="rail-btn" data-pane="settings" title="设置">⚙</div>
      <div class="spacer"></div>
      <div class="rail-btn" id="collapseBtn" title="折叠 / 展开侧栏">⇤</div>
    </nav>
    <aside id="sidebar">
      <div class="side-head"><b id="sideTitle">历史对话</b><div class="spacer"></div>
        <button class="ghost" id="closeSide" title="折叠到最左侧">⇤</button></div>
      <div class="side-body">
        <div class="pane active" id="pane-chat">
          <button class="primary" id="newChatBtn" style="width:100%;margin-bottom:8px">＋ 新建对话</button>
          <div class="search-row">
            <input type="text" id="convSearch" placeholder="全局搜索：所有对话" />
            <button id="convSearchBtn">搜</button>
          </div>
          <div id="convResults" style="margin-bottom:8px"></div>
          <div id="convList"></div>
        </div>
        <div class="pane" id="pane-models"></div>
        <div class="pane" id="pane-mcp"></div>
        <div class="pane" id="pane-skills">
          <div class="search-row">
            <input type="text" id="skillSearch" placeholder="在线搜索免费 Skill" />
            <button id="skillSearchBtn">搜</button>
          </div>
          <div id="skillResults"></div>
          <div style="height:8px"></div>
          <div id="skillList"></div>
        </div>
        <div class="pane" id="pane-settings"></div>
      </div>
    </aside>
    <section class="chat">
      <div class="searchbar" id="searchBar">
        <input type="text" id="searchIn" placeholder="在当前对话内搜索…（Enter 下一个 / Shift+Enter 上一个）" />
        <button class="ghost" id="searchPrev" title="上一个匹配">↑</button>
        <button class="ghost" id="searchNext" title="下一个匹配">↓</button>
        <span class="cnt" id="searchCnt">-</span>
        <button class="ghost" id="searchClose" title="关闭搜索">✕</button>
      </div>
      <div class="messages" id="messages"></div>
      <div class="composer">
        <div class="refbar" id="refBar"></div>
        <div class="box">
          <button class="btn-ref" id="refBtn" title="引用其他对话的内容或成果">🔗 引用</button>
          <textarea id="input" rows="1" placeholder="输入消息，Enter 发送，Shift+Enter 换行"></textarea>
          <button class="primary" id="sendBtn">发送</button>
          <button id="stopBtn" style="display:none">停止</button>
        </div>
        <div class="hint" id="hintLine">SimpleWork · 本地优先 · 模型/MCP/Skill 均由本地配置驱动</div>
      </div>
    </section>
  </main>
</div>

<script>
const $ = (id) => document.getElementById(id);
const DESK = window.simpleworkDesktop || null;
const LAST_KEY = 'simplework.lastConversation';
let state = null;
let controller = null;
let deskInfo = null;
let convs = [];
let currentConvId = null;
let activePane = 'chat';

function esc(s){return String(s==null?'':s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));}

function md(src){
  let s = esc(src||'');
  const blocks = [];
  s = s.replace(/```(\w*)\n([\s\S]*?)```/g, (m, lang, code) => {
    blocks.push('<div class="codewrap"><pre class="code"><code>' + code.replace(/\n$/,'') + '</code></pre></div>');
    return '\u0000BLOCK' + (blocks.length-1) + '\u0000';
  });
  s = s.replace(/`([^`\n]+)`/g, '<code>$1</code>');
  s = s.replace(/^### (.*)$/gm, '<h4 style="margin:10px 0 4px">$1</h4>');
  s = s.replace(/^## (.*)$/gm, '<h3 style="margin:12px 0 6px">$1</h3>');
  s = s.replace(/^# (.*)$/gm, '<h2 style="margin:14px 0 6px">$1</h2>');
  s = s.replace(/^\s*[-*] (.*)$/gm, '<li>$1</li>');
  s = s.replace(/\*\*([^*]+)\*\*/g, '<b>$1</b>');
  s = s.replace(/\[([^\]]+)\]\((https?:[^)]+)\)/g, '<a href="$2" target="_blank" rel="noreferrer">$1</a>');
  s = s.replace(/\n/g, '<br/>');
  s = s.replace(/\u0000BLOCK(\d+)\u0000/g, (m,i)=>blocks[+i]);
  return s;
}

function fmtTime(ts){
  if(!ts) return '';
  const d = new Date(ts), now = new Date();
  const p = n => String(n).padStart(2,'0');
  if (d.toDateString() === now.toDateString()) return p(d.getHours())+':'+p(d.getMinutes());
  const y = d.getFullYear()===now.getFullYear() ? '' : d.getFullYear()+'/';
  return y + (d.getMonth()+1) + '/' + d.getDate();
}

function scrollBottom(){ const m=$('messages'); m.scrollTop = m.scrollHeight; }

/* ---------- 侧栏折叠 ---------- */
function setCollapsed(v){
  document.body.classList.toggle('collapsed', v);
  $('collapseBtn').textContent = v ? '⇥' : '⇤';
  $('collapseBtn').title = v ? '展开侧栏' : '折叠到最左侧';
  try{ localStorage.setItem('simplework.sidebarCollapsed', v?'1':'0'); }catch{}
}
function showPane(name){
  const tabs = document.querySelectorAll('.rail-btn[data-pane]');
  if (activePane === name && !document.body.classList.contains('collapsed')) {
    setCollapsed(true);
    tabs.forEach(x=>x.classList.toggle('active', x.dataset.pane===name));
    return;
  }
  activePane = name;
  setCollapsed(false);
  tabs.forEach(x=>x.classList.toggle('active', x.dataset.pane===name));
  document.querySelectorAll('.pane').forEach(x=>x.classList.toggle('active', x.id==='pane-'+name));
  $('sideTitle').textContent = {chat:'历史对话',models:'模型',mcp:'MCP',skills:'Skills',settings:'设置'}[name]||'';
}

/* ---------- 消息渲染 ---------- */
function toolNode(name, args, ok, ms, result){
  const d = document.createElement('details');
  d.className = 'tool'; d.open = false;
  const head = (ok?'✓ ':'✗ ') + name + ' · ' + esc(String(args||'').slice(0,120));
  d.innerHTML = '<summary>' + esc(head) + (ms!=null?' · '+ms+'ms':'') + '</summary><pre></pre>';
  if (result != null) d.querySelector('pre').textContent = result;
  return d;
}

/* ---------- 复制 ---------- */
async function copyText(text, btn){
  const t = String(text ?? '');
  let okk = true;
  try{
    if (navigator.clipboard && window.isSecureContext) await navigator.clipboard.writeText(t);
    else throw new Error('no-clipboard-api');
  }catch{
    try{
      const ta=document.createElement('textarea');
      ta.value=t; ta.style.cssText='position:fixed;top:0;left:0;opacity:0';
      document.body.appendChild(ta); ta.focus(); ta.select();
      okk = document.execCommand('copy');
      ta.remove();
    }catch{ okk=false; }
  }
  if(btn){
    const old=btn.textContent;
    btn.classList.add('done'); btn.textContent = okk ? '已复制 ✓' : '复制失败';
    setTimeout(()=>{ btn.classList.remove('done'); btn.textContent=old; }, 1400);
  }
}

function addCopyBtn(host, title, getText, label){
  const b=document.createElement('button');
  b.className='copy'; b.textContent=label||'⧉'; b.title=title||'复制';
  b.onclick=(e)=>{ e.stopPropagation(); copyText(typeof getText==='function'?getText():getText, b); };
  host.appendChild(b);
  return b;
}

/** 给代码块 / 工具输出挂上复制按钮（渲染后调用，重复调用安全） */
function attachCopyables(root){
  root.querySelectorAll('.codewrap').forEach(w=>{
    if(w.querySelector(':scope > .copy')) return;
    const pre=w.querySelector('pre');
    addCopyBtn(w,'复制代码',()=>pre?pre.textContent:'','⧉');
  });
  root.querySelectorAll('.tool').forEach(t=>{
    if(t.querySelector(':scope > .copy')) return;
    const pre=t.querySelector('pre');
    addCopyBtn(t,'复制工具输出',()=>pre?pre.textContent:'','⧉');
  });
}

function bubbleText(wrap){
  const b=wrap?wrap.querySelector('.bubble'):null;
  if(!b) return '';
  // 引用以文本形式一并复制，便于粘贴到别处时保留来源
  let refs='';
  try{ const rs=JSON.parse(b.dataset.refs||'[]'); if(rs.length) refs='\n【引用的内容】\n'+rs.map(r=>'· '+refLabel(r)+'：\n'+(r.text||'')).join('\n\n'); }catch{}
  return (b.dataset.raw || '') + refs;
}
function toolDigest(wrap){
  const b=wrap?wrap.querySelector('.bubble'):null; if(!b) return '';
  const out=[];
  b.querySelectorAll('.tool').forEach(t=>{
    const sum=t.querySelector('summary'), pre=t.querySelector('pre');
    const res = pre ? (pre.textContent||'').trim() : '';
    out.push('· '+(sum?sum.textContent.trim():'')+(res?'\n'+res:''));
  });
  return out.join('\n');
}
/** 复制「一轮对话」：提问 + 回答 + 执行过程 */
function roundText(wrap){
  if(!wrap) return '';
  const prev=wrap.previousElementSibling;
  const q=(prev&&prev.classList.contains('me'))?bubbleText(prev):'';
  const a=bubbleText(wrap), tools=toolDigest(wrap);
  return [q?'【提问】\n'+q:'', a?'【回答】\n'+a:'', tools?'【执行过程】\n'+tools:''].filter(Boolean).join('\n\n');
}

/* ---------- 执行过程（默认收起） ---------- */
function stepsBox(bubble){
  let box=bubble.querySelector(':scope > .steps');
  if(!box){
    box=document.createElement('details');
    box.className='steps'; box.open=false;
    box.innerHTML='<summary></summary>';
    bubble.appendChild(box);
  }
  return box;
}
function refreshSteps(box){
  const tools=[...box.querySelectorAll('.tool')];
  const running=tools.some(t=>t.dataset.running==='1');
  const ms=tools.reduce((a,t)=>a+(Number(t.dataset.ms)||0),0);
  const sum=box.querySelector('summary');
  if(sum) sum.textContent=(running?'⏳ 执行中':'⚙ 执行过程')+' · '+tools.length+' 步'+
    (!running && ms ? ' · '+(ms/1000).toFixed(1)+'s' : '');
  box.dataset.count=String(tools.length);
}
/** 消息正文容器（流式渲染只更新它，避免清掉复制按钮） */
function textDiv(bubble){
  let t=bubble.querySelector(':scope > .mtext');
  if(!t){ t=document.createElement('div'); t.className='mtext'; bubble.insertBefore(t, bubble.firstChild); }
  return t;
}

function addMsg(role){
  const wrap = document.createElement('div');
  wrap.className = 'msg' + (role==='me' ? ' me' : '');
  wrap.innerHTML = '<div class="row"><div class="avatar '+(role==='me'?'me':'ai')+'">'+(role==='me'?'我':'SW')+'</div><div class="bubble"></div></div>';
  $('messages').appendChild(wrap);
  const bubble = wrap.querySelector('.bubble');
  const copies=document.createElement('div'); copies.className='copies';
  if(role==='me'){
    addCopyBtn(copies,'复制这条消息',()=>bubble.dataset.raw||bubble.textContent,'复制');
  }else{
    addCopyBtn(copies,'复制本轮（提问 + 回答 + 执行过程）',()=>roundText(wrap),'复制本轮');
    addCopyBtn(copies,'只复制回答正文',()=>bubble.dataset.raw||bubble.textContent,'复制回答');
  }
  bubble.appendChild(copies);
  scrollBottom();
  return bubble;
}

function addTool(bubble, name, args){
  const box=stepsBox(bubble);
  const d = toolNode(name, JSON.stringify(args||{}), null, null, null);
  d.dataset.running='1';
  d.querySelector('summary').textContent = '⏳ 调用 ' + name + ' · ' + esc(JSON.stringify(args||{}).slice(0,120));
  box.appendChild(d);
  refreshSteps(box);
  scrollBottom();
  return d;
}

function renderStoredMsg(m){
  const wrap = document.createElement('div');
  wrap.className = 'msg' + (m.role==='user' ? ' me' : '');
  const row = document.createElement('div'); row.className='row';
  const av = document.createElement('div');
  av.className = 'avatar '+(m.role==='user'?'me':'ai');
  av.textContent = m.role==='user'?'我':'SW';
  const b = document.createElement('div'); b.className='bubble';
  b.dataset.raw = m.text || '';
  if(m.refs && m.refs.length) b.dataset.refs = JSON.stringify(m.refs);
  const body = document.createElement('div'); body.className='mtext';
  if (m.text) body.innerHTML = md(m.text); else body.textContent = '（无输出）';
  b.appendChild(body);
  insertRefCards(b, m.refs);
  if ((m.tools||[]).length){
    const box = stepsBox(b);
    (m.tools||[]).forEach(t=>{
      const d = toolNode(t.name, t.args, t.ok, t.durationMs, t.result);
      d.dataset.running='0'; d.dataset.ms=String(t.durationMs||0);
      box.appendChild(d);
    });
    refreshSteps(box);
  }
  if (m.error){ const e=document.createElement('div'); e.style.color = m.role==='user'?'#ffe4e4':'var(--err)'; e.textContent='⚠ '+m.error; b.appendChild(e); }
  const copies=document.createElement('div'); copies.className='copies';
  if(m.role==='user'){
    addCopyBtn(copies,'复制这条消息',()=>b.dataset.raw||'','复制');
  }else{
    addCopyBtn(copies,'复制本轮（提问 + 回答 + 执行过程）',()=>roundText(wrap),'复制本轮');
    addCopyBtn(copies,'只复制回答正文',()=>b.dataset.raw||'','复制回答');
  }
  b.appendChild(copies);
  attachCopyables(b);
  row.append(av,b); wrap.appendChild(row);
  $('messages').appendChild(wrap);
  return wrap;
}

function showEmpty(){
  $('messages').innerHTML = '<div class="empty"><h2>有什么可以帮你？</h2>'+
    '<div>对话会自动保存，切换左侧「💬 历史对话」可继续上次的上下文。</div>'+
    '<div>左侧图标栏可切换模型 / MCP / Skills / 设置，点「⇤」把面板收进最左侧。</div></div>';

}

/* ---------- 会话 ---------- */
async function loadConversations(){
  try{
    const j = await (await fetch('/api/conversations')).json();
    convs = j.conversations || [];
  }catch{ convs = []; }
  renderConvList();
}

function renderConvList(){
  const box = $('convList');
  box.innerHTML = '';
  if(!convs.length){
    box.innerHTML = '<div class="item" style="background:transparent;border-style:dashed"><div class="d">还没有历史对话，发一条消息就会自动保存。</div></div>';
    return;
  }
  convs.forEach(c=>{
    const el = document.createElement('div');
    el.className = 'conv' + (c.id===currentConvId?' active':'');
    el.innerHTML = '<div class="t">'+esc(c.title||'新对话')+'</div>'+
      '<div class="m">'+esc(fmtTime(c.updatedAt))+' · '+c.messageCount+' 条'+(c.model?' · '+esc(c.model):'')+'</div>';
    const del = document.createElement('div');
    del.className='del'; del.textContent='×'; del.title='删除该对话';
    del.onclick = async(e)=>{
      e.stopPropagation();
      if(!confirm('删除对话「'+(c.title||'新对话')+'」？')) return;
      await fetch('/api/conversations/'+c.id,{method:'DELETE'});
      if(c.id===currentConvId){ currentConvId=null; showEmpty(); }
      await loadConversations();
    };
    el.appendChild(del);
    const cp = document.createElement('div');
    cp.className='del'; cp.style.right='22px'; cp.textContent='⧉'; cp.title='复制整场对话';
    cp.onclick = async(e)=>{
      e.stopPropagation();
      const full = await convFullText(c.id);
      await copyText('【'+(c.title||'新对话')+'】\n\n'+full, cp);
    };
    el.appendChild(cp);
    el.onclick = ()=>openConversation(c.id);

}

async function openConversation(id){
  if(typeof closeSearch==='function') closeSearch();
  clearPendingRefs();
  const j = await (await fetch('/api/conversations/'+encodeURIComponent(id))).json();
  if(!j.conversation){ await loadConversations(); return; }
  currentConvId = id;
  try{ localStorage.setItem(LAST_KEY, id); }catch{}
  const c = j.conversation;
  $('messages').innerHTML = '';
  if(!c.messages.length){ showEmpty(); } else {
    c.messages.forEach(renderStoredMsg);
    renderKeyNotice();
  }
  if(c.provider){ $('providerSel').value = c.provider; fillModels(); if(c.model) $('modelSel').value = c.model; }
  await loadConversations();
  scrollBottom();
}

async function newConversation(){
  clearPendingRefs();
  const j = await (await fetch('/api/conversations',{method:'POST',headers:{'Content-Type':'application/json'},
    body:JSON.stringify({provider:$('providerSel').value, model:$('modelSel').value})})).json();
  currentConvId = j.conversation ? j.conversation.id : null;
  try{ localStorage.setItem(LAST_KEY, currentConvId||''); }catch{}
  $('messages').innerHTML='';
  showEmpty();
  await loadConversations();
  $('input').focus();
}

/* ---------- 搜索：对话内 + 全局 ---------- */
let hitState = { q:'', marks:[], idx:-1 };

function escRe(s){ return String(s).replace(/[.*+?^${}()|[\]\\]/g,'\\$&'); }

function clearHits(){
  const m=$('messages');
  m.querySelectorAll('mark.hit').forEach(x=>{ x.replaceWith(x.textContent); });
  m.normalize();
  hitState = { q:'', marks:[], idx:-1 };
}

function runInConvSearch(q){
  clearHits();
  const m=$('messages');
  if(!q){ $('searchCnt').textContent='-'; return; }
  const lower=q.toLowerCase();
  const walker=document.createTreeWalker(m, NodeFilter.SHOW_TEXT, { acceptNode(n){
    if(!n.nodeValue || !n.nodeValue.trim()) return NodeFilter.FILTER_REJECT;
    const p=n.parentElement;
    if(!p || p.closest('button,.copy,script,style')) return NodeFilter.FILTER_REJECT;
    return n.nodeValue.toLowerCase().includes(lower) ? NodeFilter.FILTER_ACCEPT : NodeFilter.FILTER_REJECT;
  }});
  const nodes=[]; while(walker.nextNode()) nodes.push(walker.currentNode);
  for(const n of nodes){
    const v=n.nodeValue, lv=v.toLowerCase(), frag=document.createDocumentFragment();
    let i=0,pos;
    while((pos=lv.indexOf(lower,i))>=0){
      if(pos>i) frag.appendChild(document.createTextNode(v.slice(i,pos)));
      const mk=document.createElement('mark'); mk.className='hit'; mk.textContent=v.slice(pos,pos+lower.length);
      frag.appendChild(mk); i=pos+lower.length;
    }
    if(i<v.length) frag.appendChild(document.createTextNode(v.slice(i)));
    n.parentNode.replaceChild(frag,n);
  }
  hitState.q=q; hitState.marks=[...m.querySelectorAll('mark.hit')]; hitState.idx=-1;
  $('searchCnt').textContent = hitState.marks.length ? '1 / '+hitState.marks.length : '无匹配';
  if(hitState.marks.length) gotoHit(0);
}

function gotoHit(i){
  const marks=hitState.marks;
  if(!marks.length){ $('searchCnt').textContent='无匹配'; return; }
  hitState.idx=(i+marks.length)%marks.length;
  marks.forEach(x=>x.classList.remove('cur'));
  const cur=marks[hitState.idx];
  cur.classList.add('cur');
  cur.scrollIntoView({block:'center', behavior:'smooth'});
  $('searchCnt').textContent=(hitState.idx+1)+' / '+marks.length;
}

function openSearch(prefill){
  $('searchBar').classList.add('on');
  const inp=$('searchIn');
  if(prefill){ inp.value=prefill; runInConvSearch(prefill); }
  inp.focus(); inp.select();
}
function closeSearch(){
  clearHits();
  $('searchBar').classList.remove('on');
  $('searchIn').value='';
  $('searchCnt').textContent='-';
}

/** 全局搜索：调服务端在所有会话里找 */
async function doConvSearch(){
  const q=$('convSearch').value.trim();
  const box=$('convResults'), list=$('convList');
  if(!q){ box.innerHTML=''; list.style.display=''; return; }
  box.innerHTML='<div class="d">检索中…</div>';
  const r = await (await fetch('/api/search?q='+encodeURIComponent(q)+'&scope=all')).json().catch(()=>({hits:[]}));
  box.innerHTML='';
  const hits=r.hits||[];
  if(!hits.length){
    box.innerHTML='<div class="d">没有找到包含「'+esc(q)+'」的对话。</div>';
    list.style.display='none';
    return;
  }
  list.style.display='none';
  const head=document.createElement('div'); head.className='sect';
  head.textContent='搜索结果 · '+hits.length+' 个对话';
  box.appendChild(head);
  const re=new RegExp('('+escRe(esc(q))+')','gi');
  hits.forEach(h=>{
    const el=document.createElement('div'); el.className='ghit';
    const hit0=h.matches && h.matches[0];
    const snip = hit0 ? esc(hit0.snippet).replace(re,'<mark>$1</mark>') : '';
    el.innerHTML='<div class="t">'+esc(h.title||'新对话')+'</div>'+
      (snip?'<div class="s">'+(hit0.role==='user'?'我：':'AI：')+snip+'</div>':'<div class="s">（标题匹配）</div>')+
      '<div class="m">'+esc(fmtTime(h.updatedAt))+' · '+h.total+' 处匹配</div>';
    el.onclick = async ()=>{
      await openConversation(h.id);
      setTimeout(()=>openSearch(q), 150);
    };
    box.appendChild(el);
  });
}

/** 整场对话的纯文本（用于「复制整场对话」） */
async function convFullText(id){
  const j = await (await fetch('/api/conversations/'+encodeURIComponent(id))).json();
  const c = j.conversation;
  if(!c) return '';
  return (c.messages||[]).map(m=>{
    const tools=(m.tools||[]).length
      ? '\n' + (m.tools||[]).map(t=>'  · '+t.name+(t.ok?' ✓':' ✗')+' '+t.durationMs+'ms').join('\n')
      : '';
    return (m.role==='user'?'我：':'AI：') + (m.text||'') + tools;
  }).join('\n\n');
}

/* ---------- 自定义模型：弹窗表单 ---------- */
function showModal(titleText, buildBody, onOk, okText){
  const mask=document.createElement('div'); mask.className='mask';
  const box=document.createElement('div'); box.className='modal';
  const head=document.createElement('div'); head.className='modal-head';
  const hb=document.createElement('b'); hb.textContent=titleText; head.appendChild(hb);
  const sp=document.createElement('div'); sp.style.flex='1'; head.appendChild(sp);
  const x=document.createElement('button'); x.className='ghost'; x.textContent='✕'; x.onclick=()=>mask.remove(); head.appendChild(x);
  const body=document.createElement('div'); body.className='modal-body';
  const foot=document.createElement('div'); foot.className='modal-foot';
  const cancel=document.createElement('button'); cancel.textContent='取消'; cancel.onclick=()=>mask.remove();
  const ok=document.createElement('button'); ok.className='primary'; ok.textContent=okText||'保存';
  foot.append(cancel, ok);
  box.append(head, body, foot); mask.appendChild(box); document.body.appendChild(mask);
  mask.addEventListener('click', e=>{ if(e.target===mask) mask.remove(); });
  const ctl = { body, okBtn:ok, close:()=>mask.remove() };
  buildBody(ctl);
  ok.onclick = async ()=>{ ok.disabled=true; const old=ok.textContent; ok.textContent='处理中…';
    try{ const r = await onOk(); if(r!==false) mask.remove(); }
    finally{ ok.disabled=false; ok.textContent=old; } };
  return ctl;
}

function frow(parent, label, inner, tip){
  const d=document.createElement('div'); d.className='frow';
  const l=document.createElement('label'); l.textContent=label; d.appendChild(l);
  if(typeof inner==='string') d.insertAdjacentHTML('beforeend', inner); else d.appendChild(inner);
  if(tip){ const t=document.createElement('div'); t.className='tip'; t.innerHTML=tip; d.appendChild(t); }
  parent.appendChild(d); return d;
}

function parseModelLines(text, defContext, defTools){
  return text.split(/\r?\n/).map(l=>l.trim()).filter(Boolean).map(line=>{
    const parts = line.split('|').map(s=>s.trim());
    const id = parts[0] || '';
    return { id, label: parts[1] || id, context: Number(parts[2])>0 ? Number(parts[2]) : defContext, tools: defTools };
  }).filter(m=>m.id);
}

function autoEnvName(id){
  return (id||'').toUpperCase().replace(/[^A-Z0-9]+/g,'_').replace(/^_+|_+$/g,'') + '_API_KEY';
}

function openProviderForm(existing){
  const isEdit = !!existing;
  let collect = ()=>({});
  showModal(isEdit ? '编辑自定义模型' : '添加自定义模型', (ctl)=>{
    const b = ctl.body;
    const nameI = document.createElement('input'); nameI.placeholder='例如：公司内部模型';
    frow(b,'显示名称',nameI);
    const idI = document.createElement('input'); idI.placeholder='英文小写，如 my-model';
    if(isEdit){ idI.value=existing.id; idI.disabled=true; }
    frow(b,'唯一标识（英文小写）',idI, isEdit?'保存后不可修改':'用于配置文件与命令行，如 <code>sw models use my-model</code>');

    const f2=document.createElement('div'); f2.className='f2';
    const protoWrap=document.createElement('div');
    const protoS=document.createElement('select');
    [['openai','OpenAI 兼容（绝大多数）'],['anthropic','Anthropic 原生'],['ollama','Ollama 本地']].forEach(([v,t])=>{
      const o=document.createElement('option'); o.value=v; o.textContent=t; protoS.appendChild(o); });
    protoWrap.innerHTML='<label>协议</label>'; protoWrap.appendChild(protoS);
    const ctxWrap=document.createElement('div');
    const ctxI=document.createElement('input'); ctxI.type='text'; ctxI.value='32768'; ctxI.placeholder='32768';
    ctxWrap.innerHTML='<label>上下文长度</label>'; ctxWrap.appendChild(ctxI);
    f2.append(protoWrap, ctxWrap); b.appendChild(f2);

    const urlI = document.createElement('input'); urlI.placeholder='https://api.example.com/v1';
    frow(b,'接口地址 baseURL',urlI,
      'OpenAI 兼容填到 <code>/v1</code> 为止（程序会自动补 <code>/chat/completions</code>）；Ollama 填 <code>http://IP:11434</code>（不要带 /api）');

    const envRow=document.createElement('div'); envRow.className='frow';
    const envI=document.createElement('input'); envI.placeholder='留空自动生成';
    envRow.innerHTML='<label>API Key 环境变量名（可选）</label>'; envRow.appendChild(envI);
    const envTip=document.createElement('div'); envTip.className='tip'; envRow.appendChild(envTip);
    b.appendChild(envRow);

    const keyI=document.createElement('input'); keyI.type='password';
    frow(b,'API Key（可选，可稍后在设置里填）',keyI,
      '密钥只写入本机 <code>.env</code>，不会写进 models.json。本地/无密钥服务留空即可。');

    const ta=document.createElement('textarea');
    const defSel=document.createElement('select');
    const syncDefault=()=>{
      const ms=parseModelLines(ta.value, Number(ctxI.value)||32768, toolsI.checked);
      const keep=defSel.value; defSel.innerHTML='';
      ms.forEach(m=>{ const o=document.createElement('option'); o.value=m.id; o.textContent=m.label||m.id; defSel.appendChild(o); });
      if(ms.some(m=>m.id===keep)) defSel.value=keep;
    };
    ta.addEventListener('input', syncDefault);
    frow(b,'模型列表（每行一个）',ta,
      '格式：<code>模型ID</code> 或 <code>模型ID | 显示名 | 上下文</code>，例如 <code>gpt-4o | GPT-4o | 128000</code>');
    frow(b,'默认模型',defSel);

    const toolsI=document.createElement('input'); toolsI.type='checkbox'; toolsI.checked=true;
    const tw=document.createElement('label'); tw.className='chk'; tw.appendChild(toolsI);
    tw.appendChild(document.createTextNode('该模型支持工具调用（Function Calling）'));
    const twWrap=document.createElement('div'); twWrap.style.margin='2px 0 10px'; twWrap.appendChild(tw); b.appendChild(twWrap);
    toolsI.addEventListener('change', syncDefault);

    const testRow=document.createElement('div'); testRow.className='ftest';
    const bT=document.createElement('button'); bT.textContent='测试连接';
    const bF=document.createElement('button'); bF.textContent='拉取模型列表';
    const res=document.createElement('div'); res.className='res';
    testRow.append(bT,bF,res); b.appendChild(testRow);

    const syncEnvTip=()=>{ const id=(idI.value||'').trim(); envTip.innerHTML = '留空则用 <code>'+esc(autoEnvName(id))+'</code>（在 .env 里维护）'; };
    idI.addEventListener('input', syncEnvTip);
    protoS.addEventListener('change', ()=>{
      if(protoS.value==='ollama' && !urlI.value) urlI.value='http://127.0.0.1:11434';
      if(protoS.value==='anthropic' && !urlI.value) urlI.value='https://api.anthropic.com/v1';
    });

    bT.onclick = async ()=>{ res.textContent='测试中…';
      const d=collect(); if(!d.models.length){ res.textContent='请先填至少一个模型 ID'; return; }
      const r = await (await fetch('/api/providers/test',{method:'POST',headers:{'Content-Type':'application/json'},
        body:JSON.stringify({def:d, apiKey:d.apiKey, mode:'chat', model:d.defaultModel})})).json().catch(()=>({error:'请求失败'}));
      res.textContent = r.error ? '✗ '+r.error : ('✓ 连通（'+r.ms+'ms）：'+r.reply);
      res.style.color = r.error ? 'var(--err)' : 'var(--ok)';
    };
    bF.onclick = async ()=>{ res.textContent='拉取中…';
      const d=collect();
      const r = await (await fetch('/api/providers/test',{method:'POST',headers:{'Content-Type':'application/json'},
        body:JSON.stringify({def:d, apiKey:d.apiKey, mode:'models'})})).json().catch(()=>({error:'请求失败'}));
      if(r.error){ res.textContent='✗ '+r.error; res.style.color='var(--err)'; return; }
      if(!(r.models||[]).length){ res.textContent='该服务没有返回模型列表'; res.style.color='var(--warn)'; return; }
      ta.value = r.models.join('\n'); syncDefault();
      res.textContent='✓ 拉到 '+r.models.length+' 个模型，已填入上方'; res.style.color='var(--ok)';
    };

    // 编辑时回填
    if(existing){
      nameI.value=existing.name||''; protoS.value=existing.protocol||'openai';
      urlI.value=existing.baseURL||''; envI.value=existing.apiKeyEnv||'';
      if(existing.models && existing.models.length){
        ctxI.value = String(existing.models[0].context || 32768);
        toolsI.checked = existing.models[0].tools !== false;
        ta.value = existing.models.map(m=>[m.id, m.label&&m.label!==m.id?m.label:'', m.context||''].join(' | ').replace(/\s*\|\s*$/,'')).join('\n');
      }
      keyI.placeholder = existing.hasKey ? '已保存（留空保持不变）' : '可留空';
    } else {
      urlI.value='https://';
    }
    syncEnvTip(); syncDefault();
    if(existing && existing.defaultModel) defSel.value = existing.defaultModel;

    collect = () => {
      const id=(idI.value||'').trim() || (existing?existing.id:'');
      const models=parseModelLines(ta.value, Number(ctxI.value)||32768, toolsI.checked);
      return {
        id, name:(nameI.value||'').trim(), protocol:protoS.value, baseURL:(urlI.value||'').trim(),
        apiKeyEnv:(envI.value||'').trim(), apiKey:keyI.value.trim(),
        defaultModel: defSel.value || (models[0]&&models[0].id), models,
      };
    };
  }, async ()=>{
    const d = collect();
    const r = await (await fetch('/api/providers',{method:'POST',headers:{'Content-Type':'application/json'},
      body:JSON.stringify(Object.assign({}, d, {activate:true}))})).json().catch(()=>({error:'请求失败'}));
    if(r.error){ alert('保存失败：'+r.error); return false; }
    await loadState();
    $('providerSel').value = d.id; fillModels();
  }, '保存');
}

/* ---------- 跨对话引用 ---------- */
let pendingRefs = []; // 待发送的引用请求（只含 conversationId/kind/index/toolIndex，内容由服务端二次解析）

function refLabel(r){
  if(r.kind==='full') return '整场：'+(r.conversationTitle||'对话');
  if(r.kind==='tool') return '工具：'+(r.toolName||'成果');
  return (r.role==='user'?'提问：':'回答：')+String(r.text||'').replace(/\s+/g,' ').slice(0,26);
}
function refHint(r){
  const t = (r.conversationTitle||'对话');
  return r.kind==='full' ? '整场对话 · '+t : t+' · '+(r.role==='user'?'用户':'助手');
}
function renderRefBar(){
  const bar=$('refBar'); bar.innerHTML='';
  pendingRefs.forEach((r,i)=>{
    const chip=document.createElement('div'); chip.className='refchip';
    chip.title='点击预览来源对话';
    chip.innerHTML='<span>'+esc(refLabel(r))+'</span><div class="x" title="移除">×</div>';
    chip.querySelector('.x').onclick=(e)=>{ e.stopPropagation(); pendingRefs.splice(i,1); renderRefBar(); };
    chip.onclick=()=>jumpToRef(r);
    bar.appendChild(chip);
  });
  $('refBtn').classList.toggle('has', pendingRefs.length>0);
  $('refBtn').textContent = pendingRefs.length ? '🔗 引用 '+pendingRefs.length : '🔗 引用';
}

/** 在新对话/切换会话时清空待发送引用 */
function clearPendingRefs(){ pendingRefs=[]; renderRefBar(); }

/** 打开引用选择器：左列会话，右列消息/工具勾选 */
function openRefPicker(){
  const exclude = currentConvId;
  showModal('引用其他对话的内容', (ctl)=>{
    const wrap=document.createElement('div'); wrap.className='refpick';
    const left=document.createElement('div'); left.className='rp-left';
    const right=document.createElement('div'); right.className='rp-right';
    wrap.append(left,right); ctl.body.appendChild(wrap);
    const tip=document.createElement('div'); tip.className='tip'; tip.style.fontSize='11.5px';
    tip.innerHTML='勾选「整场对话」或某条消息 / 工具成果，可多选；引用内容会随本次提问一起发给模型，并显示在消息里（点击可跳回来源）。';
    ctl.body.appendChild(tip);

    let chosenConv=null;
    const items = convs.filter(c=>c.id!==exclude);
    if(!items.length){ left.innerHTML='<div class="rp-empty">没有其他对话可引用</div>'; right.innerHTML='<div class="rp-empty">先创建另一个对话并产生内容后再来引用</div>'; return; }

    function renderRight(){
      right.innerHTML='';
      if(!chosenConv) return;
      const head=document.createElement('div'); head.className='rp-head';
      const info=document.createElement('span'); info.className='m'; info.style.color='var(--muted)'; info.style.fontSize='11px';
      info.textContent=chosenConv.messageCount+' 条消息';
      head.appendChild(info); right.appendChild(head);
      const all=document.createElement('label'); all.className='rp-msg'; all.style.display='flex'; all.style.alignItems='center';
      all.innerHTML='<input type="checkbox" /> <b>整场对话全部内容</b>';
      const allBox=all.querySelector('input');
      allBox.checked=pendingRefs.some(r=>r.conversationId===chosenConv.id && r.kind==='full');
      allBox.onchange=()=>{
        if(allBox.checked){
          pendingRefs.push({conversationId:chosenConv.id, kind:'full', conversationTitle:chosenConv.title});
        }else{
          pendingRefs=pendingRefs.filter(r=>!(r.conversationId===chosenConv.id && r.kind==='full'));
        }
        renderRefBar(); renderRight();
      };
      right.appendChild(all);
      fetch('/api/conversations/'+encodeURIComponent(chosenConv.id)).then(r=>r.json()).then(j=>{
        const c=j.conversation; if(!c) return;
        (c.messages||[]).forEach((m,idx)=>{
          const d=document.createElement('div'); d.className='rp-msg';
          const label=document.createElement('label');
          const cb=document.createElement('input'); cb.type='checkbox';
          cb.checked=pendingRefs.some(r=>r.conversationId===c.id&&r.kind==='message'&&r.index===idx);
          cb.onchange=()=>{
            if(cb.checked) pendingRefs.push({conversationId:c.id,kind:'message',index:idx,role:m.role,text:m.text,conversationTitle:c.title});
            else pendingRefs=pendingRefs.filter(r=>!(r.conversationId===c.id&&r.kind==='message'&&r.index===idx));
            renderRefBar(); renderRight();
          };
          const body=document.createElement('div'); body.className='body';
          body.innerHTML='<div class="who">'+(m.role==='user'?'👤 用户':'🤖 助手')+' · '+esc(fmtTime(m.ts))+'</div>'+
            '<div class="txt">'+esc((m.text||'').replace(/\s+/g,' ').slice(0,160))+'</div>';
          label.append(cb,body); d.appendChild(label);
          (m.tools||[]).forEach((t,ti)=>{
            const tl=document.createElement('label'); tl.className='rp-tool';
            const tb=document.createElement('input'); tb.type='checkbox';
            tb.checked=pendingRefs.some(r=>r.conversationId===c.id&&r.kind==='tool'&&r.index===idx&&r.toolIndex===ti);
            tb.onchange=()=>{
              if(tb.checked) pendingRefs.push({conversationId:c.id,kind:'tool',index:idx,toolIndex:ti,toolName:t.name,role:m.role,conversationTitle:c.title});
              else pendingRefs=pendingRefs.filter(r=>!(r.conversationId===c.id&&r.kind==='tool'&&r.index===idx&&r.toolIndex===ti));
              renderRefBar(); renderRight();
            };
            const ts=document.createElement('span'); ts.textContent='⚙ '+esc(t.name)+' · '+esc(String(t.result||'').replace(/\s+/g,' ').slice(0,60));
            tl.append(tb,ts); d.appendChild(tl);
          });
          right.appendChild(d);
        });
      });
    }
    items.forEach(c=>{
      const el=document.createElement('div'); el.className='rp-item'+(chosenConv&&chosenConv.id===c.id?' active':'');
      el.innerHTML='<div class="t">'+esc(c.title||'新对话')+'</div><div class="m">'+esc(fmtTime(c.updatedAt))+' · '+c.messageCount+' 条</div>';
      el.onclick=()=>{ chosenConv=c; left.querySelectorAll('.rp-item').forEach(x=>x.classList.remove('active')); el.classList.add('active'); renderRight(); };
      left.appendChild(el);
    });
    left.querySelector('.rp-item').click();
    ctl._done=()=>{};
  }, ()=>{ renderRefBar(); return true; }, '完成');
}

/** 点击引用卡片/待发送 chip → 打开来源对话并定位消息或工具 */
async function jumpToRef(r){
  if(!r || !r.conversationId) return;
  await openConversation(r.conversationId);
  await new Promise(res=>setTimeout(res,200));
  const msgs=$('messages').querySelectorAll('.msg');
  const target=msgs[Number(r.index)||0];
  const node = target || $('messages').querySelector('.msg:last-child');
  if(!node) return;
  node.classList.add('flash');
  setTimeout(()=>node.classList.remove('flash'),1700);
  node.scrollIntoView({block:'center',behavior:'smooth'});
  if(r.kind==='tool'){
    const tools=node.querySelectorAll('.tool');
    const t=tools[Number(r.toolIndex)||0];
    if(t){ t.open=true; t.classList.add('flash'); setTimeout(()=>t.classList.remove('flash'),1700); }
  }
}

/** 在消息气泡里插入引用卡片（可点击跳转） */
function insertRefCards(bubble, refs){
  if(!refs||!refs.length) return;
  refs.forEach(r=>{
    const card=document.createElement('div'); card.className='refcard';
    card.title='点击跳转到来源对话';
    card.innerHTML='<div class="rt">🔗 引用 · '+esc(refHint(r))+'</div><div class="rx">'+esc(String(r.text||'').replace(/\s+/g,' ').slice(0,140))+'</div>';
    card.onclick=(e)=>{ e.stopPropagation(); jumpToRef(r); };
    bubble.insertBefore(card, bubble.firstChild);
  });
}

/* ---------- 发送 ---------- */
async function send(){
  const text = $('input').value.trim();
  if(!text || controller) return;
  $('input').value='';
  const notice = document.getElementById('keyNotice'); if(notice) notice.remove();
  if(!$('messages').children.length || $('messages').querySelector('.empty')) $('messages').innerHTML='';

  const ub = addMsg('me');
  ub.dataset.raw = text;
  textDiv(ub).innerHTML = md(text);
  const sendingRefs = pendingRefs.map(r=>({conversationId:r.conversationId,kind:r.kind,index:r.index,toolIndex:r.toolIndex}));
  if(sendingRefs.length){
    ub.dataset.refs = JSON.stringify(sendingRefs.map(r=>({
      ...r,
      conversationTitle:(convs.find(c=>c.id===r.conversationId)||{}).title||'',
      text:r.kind==='message'||r.kind==='full' ? (r.text||'') : '',
      toolName:r.toolName||'',
    })));
    insertRefCards(ub, JSON.parse(ub.dataset.refs));
  }
  clearPendingRefs();
  attachCopyables(ub);
  const bubble = addMsg('ai');
  controller = new AbortController();
  $('sendBtn').style.display='none'; $('stopBtn').style.display='';
  let buf=''; let textNode=null; let currentTool=null;
  try{
    const res = await fetch('/api/chat',{method:'POST',headers:{'Content-Type':'application/json'},
      body:JSON.stringify({message:text, provider:$('providerSel').value, model:$('modelSel').value,
        conversationId: currentConvId, refs: sendingRefs}), signal:controller.signal});
    const reader = res.body.getReader(); const dec = new TextDecoder(); let acc='';
    while(true){
      const {done,value} = await reader.read();
      if(done) break;
      acc += dec.decode(value,{stream:true});
      let i;
      while((i=acc.indexOf('\n\n'))>=0){
        const chunk=acc.slice(0,i); acc=acc.slice(i+2);
        const line=chunk.split('\n').find(l=>l.startsWith('data:'));
        if(!line) continue;
        let ev; try{ ev=JSON.parse(line.slice(5)); }catch{ continue; }
        if(ev.type==='conversation'){
          currentConvId = ev.id;
          try{ localStorage.setItem(LAST_KEY, ev.id); }catch{}
        } else if(ev.type==='refs'){
          // 服务端返回二次解析后的引用（内容以磁盘为准），刷新展示卡片
          const myBubble=ub;
          myBubble.querySelectorAll('.refcard').forEach(x=>x.remove());
          insertRefCards(myBubble, ev.refs||[]);
          myBubble.dataset.refs=JSON.stringify(ev.refs||[]);
        } else if(ev.type==='text' || ev.type==='reasoning'){
          const tn = textDiv(bubble);
          buf += ev.delta; tn.innerHTML = md(buf); scrollBottom();
        } else if(ev.type==='tool_start'){
          currentTool = addTool(bubble, ev.name, ev.args);
        } else if(ev.type==='tool_end'){
          if(currentTool){
            const sum = currentTool.querySelector('summary');
            sum.textContent = (ev.ok?'✓ ':'✗ ') + sum.textContent.replace('⏳ ','') + ' · ' + ev.durationMs + 'ms';
            const pre = currentTool.querySelector('pre');
            if(pre) pre.textContent = ev.result || '';
            currentTool.dataset.running='0'; currentTool.dataset.ms=String(ev.durationMs||0);
            const box = currentTool.closest('.steps'); if(box) refreshSteps(box);
            attachCopyables(currentTool);
            currentTool = null;
          }
          scrollBottom();
        } else if(ev.type==='error'){
          const d=document.createElement('div'); d.style.color='var(--err)'; d.textContent='⚠ '+ev.message; bubble.appendChild(d);
        }
      }
    }
  }catch(e){
    if(e.name!=='AbortError'){ const d=document.createElement('div'); d.style.color='var(--err)'; d.textContent='⚠ '+e.message; bubble.appendChild(d); }
  }finally{
    controller=null; $('sendBtn').style.display=''; $('stopBtn').style.display='none';
    bubble.dataset.raw = buf;
    if(!buf && !bubble.querySelector('.steps')) textDiv(bubble).textContent='（无输出）';
    attachCopyables(bubble);
    scrollBottom();
    await loadConversations();
  }
}

/* ---------- 绑定 ---------- */
$('sendBtn').onclick = send;
$('refBtn').onclick = openRefPicker;
$('stopBtn').onclick = ()=>{ if(controller){ controller.abort(); controller=null; $('sendBtn').style.display=''; $('stopBtn').style.display='none'; } };
$('input').addEventListener('keydown', e=>{ if(e.key==='Enter' && !e.shiftKey){ e.preventDefault(); send(); } });
$('newBtn').onclick = newConversation;
$('railNew').onclick = newConversation;
$('newChatBtn').onclick = newConversation;
$('clearBtn').onclick = async ()=>{
  if(!currentConvId){ showEmpty(); return; }
  if(!confirm('清空当前对话的历史与上下文？')) return;
  await fetch('/api/clear',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({conversationId:currentConvId})});
  $('messages').innerHTML=''; showEmpty();
  await loadConversations();
};
$('providerSel').onchange = fillModels;
/* 搜索：对话内 */
$('searchBtn').onclick = ()=>{ $('searchBar').classList.contains('on') ? closeSearch() : openSearch(); };
$('searchClose').onclick = closeSearch;
$('searchNext').onclick = ()=>gotoHit(hitState.idx+1);
$('searchPrev').onclick = ()=>gotoHit(hitState.idx-1);
$('searchIn').addEventListener('input', ()=>runInConvSearch($('searchIn').value.trim()));
$('searchIn').addEventListener('keydown', e=>{
  if(e.key==='Enter'){ e.preventDefault(); gotoHit(hitState.idx + (e.shiftKey?-1:1)); }
  else if(e.key==='Escape'){ closeSearch(); }
});
document.addEventListener('keydown', e=>{
  if((e.ctrlKey||e.metaKey) && e.key==='f'){ e.preventDefault(); openSearch(); }
});
/* 搜索：全局（所有对话） */
$('convSearchBtn').onclick = doConvSearch;
$('convSearch').addEventListener('keydown', e=>{ if(e.key==='Enter') doConvSearch(); });
$('modelSel').onchange = async ()=>{ await fetch('/api/models/use',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({provider:$('providerSel').value,model:$('modelSel').value})}); };
document.querySelectorAll('.rail-btn[data-pane]').forEach(t=>t.onclick=()=>showPane(t.dataset.pane));
$('collapseBtn').onclick = ()=>setCollapsed(!document.body.classList.contains('collapsed'));
$('closeSide').onclick = ()=>setCollapsed(true);
$('skillSearchBtn').onclick = doSkillSearch;
$('skillSearch').addEventListener('keydown', e=>{ if(e.key==='Enter') doSkillSearch(); });
async function doSkillSearch(){
  const q=$('skillSearch').value.trim();
  const box=$('skillResults'); box.innerHTML='<div class="d">检索中...</div>';
  const r = await (await fetch('/api/skills/search?q='+encodeURIComponent(q))).json();
  box.innerHTML='';
  if(r.onlineError){ const w=document.createElement('div'); w.className='d'; w.style.color='var(--warn)'; w.textContent=r.onlineError; box.appendChild(w); }
  (r.hits||[]).slice(0,30).forEach(h=>{
    const el=document.createElement('div'); el.className='item';
    el.innerHTML='<div class="t">'+esc(h.name)+(h.installed?' <span class="tag">已装</span>':'')+'</div><div class="d">'+esc(h.desc||(h.repo+'/'+h.subPath))+'</div>';
    if(!h.installed){
      const b=document.createElement('button'); b.textContent='安装'; b.style.marginTop='6px';
      b.onclick=async()=>{ b.textContent='安装中...'; b.disabled=true;
        await fetch('/api/skills/install',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({spec:h.name})});
        await loadState(); doSkillSearch(); };
      el.appendChild(b);
    }
    box.appendChild(el);
  });
  if(!(r.hits||[]).length) box.innerHTML='<div class="d">没有结果（可能是网络不通）。</div>';
}

(async function init(){
  if (DESK) {
    $('deskBadge').style.display='';
    $('openCfgBtn').style.display='';
    $('openCfgBtn').onclick = ()=>DESK.openPath('config');
    try { deskInfo = await DESK.info(); } catch(e) { deskInfo = null; }
    if (DESK.onNewSession) DESK.onNewSession(newConversation);
  }
  let collapsed = false;
  try{ collapsed = localStorage.getItem('simplework.sidebarCollapsed')==='1'; }catch{}
  setCollapsed(collapsed);
  await loadState();
  await loadConversations();
  let last = null;
  try{ last = localStorage.getItem(LAST_KEY); }catch{}
  if (last && convs.some(c=>c.id===last)) await openConversation(last);
  else if (convs.length) await openConversation(convs[0].id);
  else showEmpty();
})();
</script>
